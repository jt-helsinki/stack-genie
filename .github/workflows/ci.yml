name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual trigger for the self-hosted acceptance job

permissions:
  contents: read

jobs:
  # Hosted runners: no virtualization needed — build, vet, lint, unit tests.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      # Type-check build-tag-gated code (e.g. //go:build integration) that plain
      # `go vet ./...` skips, so a refactor can't silently break the tag-gated
      # integration suite (it self-skips at runtime, so tests never catch it).
      - name: vet (tagged)
        run: make vet-tagged
      # golangci-lint v2 requires action v7+ (v6 installs the incompatible v1.x).
      # Pin the linter version to match the local `make check` gate so CI and
      # local agree; the action handles install + caching.
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m
      - name: unit tests
        run: make test
      - name: build
        run: make build

  # Unlike Microsandbox (Apple Hypervisor, Apple-Silicon-only), nono's Landlock/Seatbelt
  # sandboxing has no virtualization requirement, so the full S1 stack (Docker for the
  # service tier + the nono CLI) runs on a plain hosted ubuntu runner — no self-hosted
  # macOS runner needed anymore. Still manual (workflow_dispatch) until this path is
  # verified green on a hosted runner; flip to automatic once confirmed.
  acceptance-s1:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install nono
        run: curl -fsSL https://nono.sh/install.sh | sh
      - name: "[S1] acceptance"
        run: make test-acceptance
