name: release

# Semver releases, cut from tags. Pushing a semver tag (vX.Y.Z) verifies the code,
# builds the per-arch binaries, and publishes a GitHub Release AT THAT TAG marked
# "latest". The assets are named ai-<os>-<arch>, exactly what installers/install.sh
# downloads from releases/latest/download, so `curl … | sh` always pulls the newest
# TAGGED release. Merges to main do NOT release — the CI workflow (ci.yml) verifies
# them; you cut a release by pushing a tag:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# The binary links the Microsandbox Go SDK, a cgo binding, so CGO_ENABLED=1 and the
# build is NOT freely cross-compilable: darwin/arm64 is built NATIVELY on a macOS
# (Apple Silicon) runner, linux/amd64 natively on ubuntu, and linux/arm64 by
# cross-compiling on ubuntu with the aarch64 GNU C toolchain. `make release` names the
# output from `go env GOOS/GOARCH` (which honor the GOOS/GOARCH env vars), so the
# per-target env below is all it needs. The tag name is the version (injected via
# -ldflags and used as the release tag/name).
on:
  push:
    tags: ["v*.*.*"] # semver tags only
  workflow_dispatch: {} # manual re-run — select a tag ref in the Actions UI

permissions:
  contents: write # create the release and upload assets

# Serialize releases so two tags pushed close together don't race the "latest" pointer.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Full gate: fmt-check + vet + lint + test + build (native linux/amd64) at the tagged
  # commit. A failure fails the whole workflow, so no build/deploy happens.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # track the module's Go version, no drift
      # Install golangci-lint (v2, matching the local gate) onto PATH so `make check`'s
      # lint step actually runs — the Makefile's lint target silently skips when the
      # binary is absent, which would let lint failures slip into a release.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
      - name: Verify
        run: make check

  # Build one native/cross binary per supported host arch. Each uploads dist/ai-<os>-<arch>
  # as an artifact for the release job to collect.
  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-latest # Apple Silicon → native darwin/arm64
            goos: darwin
            goarch: arm64
            cross: false
          - runner: ubuntu-latest # native linux/amd64
            goos: linux
            goarch: amd64
            cross: false
          - runner: ubuntu-latest # cross-compiled linux/arm64 (cgo via aarch64 gcc)
            goos: linux
            goarch: arm64
            cross: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # cgo cross-compile to linux/arm64 needs the aarch64 GNU C toolchain.
      - name: Install aarch64 cross toolchain
        if: ${{ matrix.cross }}
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          VERSION: ${{ github.ref_name }} # the semver tag, injected into the binary via -ldflags
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # A cross build must name the arm64 C compiler; native builds use the default.
          CC: ${{ matrix.cross && 'aarch64-linux-gnu-gcc' || '' }}
        run: make release VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/ai-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  # Collect the three binaries, checksum them, and publish the Release at the tag.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the release notes diff against the prior tag
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true # flatten every artifact into ./dist
      - name: Checksums
        run: cd dist && sha256sum ai-darwin-arm64 ai-linux-amd64 ai-linux-arm64 > SHA256SUMS
      # Publish the Release AT the pushed tag, flagged "latest" so
      # releases/latest/download (used by install.sh) serves this version.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          make_latest: "true" # releases/latest/download (used by install.sh) points here
          files: |
            dist/ai-darwin-arm64
            dist/ai-linux-amd64
            dist/ai-linux-arm64
            dist/SHA256SUMS
            installers/install.sh
          generate_release_notes: true
