name: release

# Fully-automated semver releases — NO hand-tagging. Every merge/push to main computes
# the next semver version from the Conventional Commits since the last tag (feat → minor,
# fix/other → patch, BREAKING CHANGE / "!" → major; default patch), builds the per-arch
# binaries, and publishes a GitHub Release at a freshly-created tag vX.Y.Z marked "latest".
# The version is only computed (dry-run) up front; the tag is created ONLY after verify +
# build succeed, so a failed run never leaves an orphan tag.
#
# The assets are named ai-<os>-<arch>, exactly what installers/install.sh downloads from
# releases/latest/download, so `curl … | sh` always pulls the newest release.
#
# The binary links the Microsandbox Go SDK, a cgo binding, so CGO_ENABLED=1 and the build
# is NOT freely cross-compilable: darwin/arm64 is built NATIVELY on a macOS (Apple Silicon)
# runner, linux/amd64 natively on ubuntu, and linux/arm64 by cross-compiling on ubuntu with
# the aarch64 GNU C toolchain. `make release` names the output from `go env GOOS/GOARCH`
# (which honor the GOOS/GOARCH env vars), so the per-target env below is all it needs.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # manual re-run of the auto-release from the Actions tab

permissions:
  contents: write # compute/create the tag + publish the release and upload assets

# Serialize releases so concurrent merges don't race the tag / "latest" pointer.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Full gate: fmt-check + vet + lint + test + build (native linux/amd64). A failure fails
  # the workflow, so no version is cut and no release is published.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # track the module's Go version, no drift
      # Install golangci-lint (v2, matching the local gate) onto PATH so `make check`'s
      # lint step actually runs — the Makefile's lint target silently skips when the
      # binary is absent, which would let lint failures slip into a release.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
      - name: Verify
        run: make check

  # Compute the next semver from Conventional Commits since the last tag — DRY-RUN, so the
  # tag is NOT created here (the release job creates it only after build succeeds). new_tag
  # is empty when there is nothing to release (e.g. a re-run at an already-tagged commit),
  # which short-circuits build + release.
  version:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.compute.outputs.new_tag }}
      new_version: ${{ steps.compute.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so the bump is computed against the last tag
      - id: compute
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch # every merge cuts at least a patch release
          tag_prefix: v
          dry_run: true # compute only — the release job creates the tag on success

  # Build one native/cross binary per supported host arch (only when a version was cut).
  # Each uploads dist/ai-<os>-<arch> as an artifact for the release job to collect.
  build:
    needs: version
    if: ${{ needs.version.outputs.new_tag != '' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-latest # Apple Silicon → native darwin/arm64
            goos: darwin
            goarch: arm64
            cross: false
          - runner: ubuntu-latest # native linux/amd64
            goos: linux
            goarch: amd64
            cross: false
          - runner: ubuntu-latest # cross-compiled linux/arm64 (cgo via aarch64 gcc)
            goos: linux
            goarch: arm64
            cross: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # cgo cross-compile to linux/arm64 needs the aarch64 GNU C toolchain.
      - name: Install aarch64 cross toolchain
        if: ${{ matrix.cross }}
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          VERSION: ${{ needs.version.outputs.new_tag }} # computed semver, injected via -ldflags
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # A cross build must name the arm64 C compiler; native builds use the default.
          CC: ${{ matrix.cross && 'aarch64-linux-gnu-gcc' || '' }}
        run: make release VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/ai-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  # Collect the three binaries, checksum them, and publish the Release — creating the
  # computed tag at the merged commit (github.sha) and flagging it "latest".
  release:
    needs: [version, build]
    if: ${{ needs.version.outputs.new_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the release notes diff against the prior tag
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true # flatten every artifact into ./dist
      - name: Checksums
        run: cd dist && sha256sum ai-darwin-arm64 ai-linux-amd64 ai-linux-arm64 > SHA256SUMS
      - name: Publish release and create the tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          target_commitish: ${{ github.sha }} # create the tag at the merged commit
          name: ${{ needs.version.outputs.new_tag }}
          make_latest: "true" # releases/latest/download (used by install.sh) points here
          files: |
            dist/ai-darwin-arm64
            dist/ai-linux-amd64
            dist/ai-linux-arm64
            dist/SHA256SUMS
            installers/install.sh
          generate_release_notes: true
